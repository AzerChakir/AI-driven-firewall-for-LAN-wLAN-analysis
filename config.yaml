capture:
  interface: ap0          # hotspot AP interface — sees all client traffic
  bpf_filter: ip and (tcp or udp)
  snaplen: 256
  queue_size: 200000
  promiscuous: true
model:
  dir: model_save
  threshold: 0.70        # raised from 0.5 to reduce CDN false-positives
  batch_size: 64
  batch_interval_s: 0.5
flows:
  timeout_s: 120
  idle_timeout_s: 5
  active_timeout_s: 10
  min_packets: 1
firewall:
  mode: manual
  auto_block_threshold: 5
  auto_block_window_s: 60
  auto_block_ttl_s: 600
  nft_table: idsfw
  allowlist:
  # --- local / special-use ranges (RFC 1918, multicast, loopback) ---
  - 224.0.0.0/4        # multicast
  - 127.0.0.0/8        # loopback
  - 10.0.0.0/8         # RFC 1918
  - 172.16.0.0/12      # RFC 1918  (covers 172.16–172.31, incl. Pi hotspot)
  - 192.168.0.0/16     # RFC 1918
  # --- Google (Search, YouTube, APIs, GCP) ---
  - 172.217.0.0/16
  - 172.253.0.0/16
  - 142.250.0.0/15
  - 142.251.0.0/16
  - 216.58.192.0/19
  - 34.64.0.0/10       # Google Cloud APAC / global
  - 34.128.0.0/10      # Google Cloud
  # --- Microsoft (Azure, Office 365, Windows Update) ---
  - 20.0.0.0/8
  - 40.64.0.0/10
  - 52.64.0.0/11
  - 13.64.0.0/11
  # --- GitHub ---
  - 140.82.112.0/20
  - 185.199.108.0/22
  # --- Cloudflare (CDN + 1.1.1.1 DNS) ---
  - 1.1.1.0/24
  - 1.0.0.0/24
  - 104.16.0.0/13
  - 104.24.0.0/14
  - 162.158.0.0/15
  - 188.114.96.0/20
  - 197.234.240.0/22
  # --- Amazon AWS (CloudFront, S3, etc.) ---
  - 52.84.0.0/15
  - 13.32.0.0/15
  - 99.84.0.0/16
  # --- Apple (iCloud, updates) ---
  - 17.0.0.0/8
web:
  host: 0.0.0.0
  port: 8080
  advertise_ip: 192.168.50.1    # Pi's hotspot IP — reachable by all connected clients
  refresh_ms: 1000
store:
  path: data/idsfw.db
  max_flows: 5000
  max_alerts: 2000
logging:
  level: INFO
  file: null
